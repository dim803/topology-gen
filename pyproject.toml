[project]
name = "topology-gen"
version = "0.1.0"
description = "Generates a topology from a subbasis on a finite set, and checks separation axioms"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
